<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" fill="none">
  <defs>
    <linearGradient id="c2HexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="c2CoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="c2Text" x1="0%" y1="0%" x2="100%" y2="0%">
