<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="borderPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18153C" />
      <stop offset="100%" stop-color="#0B0920" />
    </linearGradient>
    <linearGradient id="textDev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Next Gen Dev (NGD) Icon Mark (64x64 at 8,8) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="url(#bgBox)" stroke="url(#borderPulse)" stroke-width="1.8" />
    
    <!-- Outer ambient subtle glow -->
    <circle cx="32" cy="32" r="24" fill="#8B5CF6" fill-opacity="0.15" filter="url(#subtleGlow)" />

    <!-- Letter N (Next) -->
    <path d="M14 44V20L24 38V20" stroke="url(#nGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter G (Gen) -->
    <path d="M37 25C35 21 32 20 29.5 22C26.8 24.5 26.8 39.5 29.5 42C33 44 36 43 37.5 40V33H32" stroke="url(#gGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter D (Dev) -->
    <path d="M41 20H45C49.5 20 50.5 26 50.5 32C50.5 38 49.5 44 45 44H41V20Z" stroke="url(#dGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Velocity accent node & code bracket dash -->
    <circle cx="24" cy="20" r="1.8" fill="#00F2FE" />
    <path d="M20 51H44" stroke="url(#borderPulse)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" />
  </g>

  <!-- Wordmark -->
  <text x="84" y="43" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">
    NEXT GEN <tspan fill="url(#textDev)">DEV</tspan>
  </text>
  <text x="86" y="60" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#A78BFA" letter-spacing="3.2">
    NEXT GENERATION TECHNOLOGIES
  </text>
</svg>
